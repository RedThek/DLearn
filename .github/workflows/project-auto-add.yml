name: Auto Add Issue to Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue to Project
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/users/RedThek/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
